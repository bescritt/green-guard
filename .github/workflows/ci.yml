name: CI

on:
  push:
    branches: [master, main]
    tags: ['*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dev dependencies
        run: npm ci
      - name: Build bundles (needed before packaging tests)
        run: npm run build
      - name: Generate signing key + build + verify signed CRX3
        run: |
          npm run key:gen
          npm run build:crx
          npm run verify:crx
      - name: Run offline test suite
        run: npm test
      - name: Driver integrity check (read-only mount respected)
        run: python3 build/tools/driver_integrity.py
